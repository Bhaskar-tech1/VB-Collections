<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VB Collections | Add Product</title>
  <link rel="icon" href="VB logo with horn accents cropped.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Page wrapper */
    .admin-page {
      min-height: 100vh;
      background: var(--bg-color);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 1rem 3rem;
    }

    /* Card */
    .admin-card {
      background: var(--surface-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 520px;
    }

    .admin-card-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .admin-card-header h1 {
      font-size: 1.8rem;
      color: var(--primary-color);
      margin-bottom: 0.4rem;
    }

    .admin-card-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .accent-line {
      width: 50px;
      height: 4px;
      background: var(--accent-color);
      border-radius: var(--radius-pill);
      margin: 0.75rem auto 0;
    }

    /* Form fields */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-color);
      margin-bottom: 0.45rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-family: var(--font-family);
      font-size: 0.95rem;
      color: var(--text-main);
      background: var(--bg-color);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.15);
    }

    .form-group select option {
      background: #fff;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed var(--border-color);
      border-radius: var(--radius-sm);
      padding: 1.8rem 1rem;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s, background 0.2s;
      background: var(--bg-color);
    }

    .upload-zone:hover,
    .upload-zone.dragover {
      border-color: var(--accent-color);
      background: rgba(0, 229, 255, 0.04);
    }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
      padding: 0;
      border: none;
      box-shadow: none;
    }

    .upload-zone i {
      font-size: 2rem;
      color: var(--accent-dark);
      margin-bottom: 0.5rem;
    }

    .upload-zone .upload-label {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .upload-zone .upload-label strong {
      color: var(--primary-color);
    }

    /* Upload status */
    .upload-status {
      display: none;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.75rem;
      padding: 0.6rem 0.9rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
    }

    .upload-status.uploading {
      display: flex;
      background: rgba(0, 229, 255, 0.08);
      color: var(--accent-dark);
      border: 1px solid rgba(0, 229, 255, 0.2);
    }

    .upload-status.success {
      display: flex;
      background: rgba(46, 204, 113, 0.08);
      color: #27ae60;
      border: 1px solid rgba(46, 204, 113, 0.25);
    }

    .upload-status.error {
      display: flex;
      background: rgba(231, 76, 60, 0.08);
      color: #c0392b;
      border: 1px solid rgba(231, 76, 60, 0.2);
    }

    /* Submit button */
    .submit-btn {
      width: 100%;
      padding: 0.9rem;
      background: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: var(--radius-pill);
      font-family: var(--font-family);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 0.5rem;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(15, 44, 89, 0.2);
    }

    .submit-btn:hover:not(:disabled) {
      background: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(15, 44, 89, 0.3);
    }

    .submit-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    /* Toast notifications */
    .toast-container {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      width: 90%;
      max-width: 380px;
    }

    .toast {
      width: 100%;
      background: #fff;
      border-radius: 10px;
      padding: 0.9rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9rem;
      box-shadow: var(--shadow-md);
      animation: toastIn 0.35s ease;
    }

    .toast.success { border-left: 4px solid #2ECC71; }
    .toast.error   { border-left: 4px solid #E74C3C; }
    .toast.success i { color: #2ECC71; font-size: 1.1rem; }
    .toast.error   i { color: #E74C3C; font-size: 1.1rem; }
    .toast span { color: var(--text-main); font-weight: 500; }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(20px); }
    }

    /* Mobile responsive */
    @media (max-width: 480px) {
      .admin-card {
        padding: 2rem 1.25rem;
      }

      .admin-card-header h1 {
        font-size: 1.5rem;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style>
</head>

<body>

  <!-- Admin header -->
  <header>
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <img src="VB logo with horn accents.png" alt="VB Collections Logo" class="logo-img">
        <span>Collections</span>
      </a>

    </div>
  </header>

  <div class="admin-page">
    <div class="admin-card">

      <!-- Header -->
      <div class="admin-card-header">
        <h1><i class="fas fa-plus-circle" style="color:var(--accent-dark); margin-right:0.4rem;"></i>Add Product</h1>
        <p>Upload a new product — it will appear on the website instantly.</p>
        <div class="accent-line"></div>
      </div>

      <!-- Form -->
      <form id="product-form" autocomplete="off">

        <div class="form-group">
          <label for="name">Product Name *</label>
          <input type="text" id="name" placeholder="e.g. Radha Krishna Marble Statue" required>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="price">Price (₹) *</label>
            <input type="number" id="price" placeholder="0" min="1" required>
          </div>
          <div class="form-group">
            <label for="category">Category *</label>
            <select id="category" required>
              <option value="">Select</option>
              <option value="Gifts">Gifts</option>
              <option value="Customized Gifts">Customized Gifts</option>
              <option value="Mobile Accessories">Mobile Accessories</option>
              <option value="Crockery">Crockery</option>
              <option value="Gadgets">Gadgets</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="subcategory">Subcategory</label>
          <input type="text" id="subcategory" placeholder="e.g. Couple Gifts, Marble Gifts…" list="sub-list">
          <datalist id="sub-list">
            <option value="Couple Gifts">
            <option value="Lighting Lamps">
            <option value="Radium Gifts">
            <option value="Marble Gifts">
            <option value="Fibre Gifts">
            <option value="Granite Gifts">
            <option value="House Hold Gifts">
            <option value="Toys">
            <option value="Watch">
            <option value="Teddy">
            <option value="Wall Clocks">
            <option value="Mobile Cases">
            <option value="Chargers">
            <option value="Cables">
            <option value="Ear Buds">
            <option value="Screen Guards">
            <option value="Power Bank">
            <option value="Wireless Earphones">
            <option value="Adapter">
            <option value="T-Shirts">
            <option value="Kitchen Items">
            <option value="Trimmers">
            <option value="Iron Boxes">
            <option value="Lamps">
            <option value="Speakers">
          </datalist>
        </div>

        <div class="form-group">
          <label>Product Image *</label>
          <div class="upload-zone" id="upload-zone">
            <input type="file" id="image-input" accept="image/*">
            <i class="fas fa-cloud-upload-alt"></i>
            <div class="upload-label">
              <strong>Click to upload</strong> or drag & drop<br>
              <span style="font-size:0.78rem;">JPG, PNG, WEBP — Max 10MB</span>
            </div>
          </div>

          <!-- Status row -->
          <div class="upload-status" id="upload-status">
            <i class="fas fa-circle-notch fa-spin" id="upload-icon"></i>
            <span id="upload-status-text">Uploading image…</span>
          </div>

          <input type="hidden" id="image-url">
        </div>

        <button type="submit" class="submit-btn" id="submit-btn" disabled>
          <i class="fas fa-plus"></i> Add Product to Website
        </button>

      </form>

      <!-- Divider -->
      <div style="display: flex; align-items: center; gap: 1rem; margin: 2rem 0 1.5rem;">
        <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
        <span style="color: var(--text-muted); font-size: 0.85rem; font-weight: 500;">or</span>
        <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
      </div>

      <!-- Manage Products Button -->
      <a href="manage-products.html" class="submit-btn" style="text-decoration: none; background: var(--accent-dark); box-shadow: 0 4px 15px rgba(0, 180, 204, 0.3);">
        <i class="fas fa-edit"></i> Manage Products
      </a>
      <p style="text-align: center; font-size: 0.8rem; color: var(--text-muted); margin-top: 0.75rem;">Edit details, delete products, search & filter</p>

    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ─── Config ────────────────────────────────────────────────────
    const CLOUD = 'djsoier5y';
    const PRESET = 'vb_collections_upload';
    const UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`;

    // ─── Supabase Config ────────────────────────────────────────────
    const SUPABASE_URL = 'https://rrdsafwfytiakupvnfok.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZHNhZndmeXRpYWt1cHZuZm9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxODAyNTEsImV4cCI6MjA5MTc1NjI1MX0.o-07NHCj4GUJ2W7KEZT3xb3W7ug1_gntNpUV3z_2uKg';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    // ─── Elements ──────────────────────────────────────────────────
    const form        = document.getElementById('product-form');
    const imageInput  = document.getElementById('image-input');
    const uploadZone  = document.getElementById('upload-zone');
    const uploadStatus = document.getElementById('upload-status');
    const uploadIcon  = document.getElementById('upload-icon');
    const uploadText  = document.getElementById('upload-status-text');
    const submitBtn   = document.getElementById('submit-btn');
    const imageUrlInput = document.getElementById('image-url');

    let uploadedImageUrl = null;

    // ─── Validation ─────────────────────────────────────────────────
    function checkValidity() {
      const ok = document.getElementById('name').value.trim() &&
                 document.getElementById('price').value &&
                 document.getElementById('category').value &&
                 uploadedImageUrl;
      submitBtn.disabled = !ok;
    }
    ['name', 'price', 'category'].forEach(id =>
      document.getElementById(id).addEventListener('input', checkValidity)
    );

    // ─── Drag & Drop ────────────────────────────────────────────────
    uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) handleUpload(file);
    });
    imageInput.addEventListener('change', () => {
      if (imageInput.files[0]) handleUpload(imageInput.files[0]);
    });

    // ─── Cloudinary Upload ──────────────────────────────────────────
    async function handleUpload(file) {
      if (file.size > 10 * 1024 * 1024) {
        showToast('Image must be under 10MB', 'error');
        return;
      }

      // Show uploading state
      uploadStatus.className = 'upload-status uploading';
      uploadIcon.className = 'fas fa-circle-notch fa-spin';
      uploadText.textContent = 'Uploading image to Cloudinary…';

      const fd = new FormData();
      fd.append('file', file);
      fd.append('upload_preset', PRESET);

      try {
        const res = await fetch(UPLOAD_URL, { method: 'POST', body: fd });
        if (!res.ok) throw new Error('Upload failed');
        const data = await res.json();

        // Apply Cloudinary optimisations
        const url = data.secure_url.replace('/upload/', '/upload/w_400,q_auto,f_auto,r_20/');
        uploadedImageUrl = url;
        imageUrlInput.value = url;

        // Show success state
        uploadStatus.className = 'upload-status success';
        uploadIcon.className = 'fas fa-check-circle';
        uploadText.textContent = 'Image uploaded successfully!';

        checkValidity();

      } catch (err) {
        uploadStatus.className = 'upload-status error';
        uploadIcon.className = 'fas fa-times-circle';
        uploadText.textContent = 'Upload failed. Please try again.';
        uploadedImageUrl = null;
        imageUrlInput.value = '';
        checkValidity();
      }
    }

    // ─── Form Submit (Direct to Supabase) ───────────────────────────
    form.addEventListener('submit', async e => {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';

      const product = {
        name:        document.getElementById('name').value.trim(),
        price:       Number(document.getElementById('price').value),
        category:    document.getElementById('category').value,
        subcategory: document.getElementById('subcategory').value.trim(),
        image:       uploadedImageUrl,
      };

      try {
        const { data, error } = await sb.from('products').insert([product]).select();
        if (error) throw new Error(error.message);

        showToast(`"${product.name}" added to website! 🎉`, 'success');
        form.reset();
        uploadedImageUrl = null;
        imageUrlInput.value = '';
        uploadStatus.className = 'upload-status';
        imageInput.value = '';

      } catch (err) {
        showToast(err.message || 'Something went wrong', 'error');
      } finally {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-plus"></i> Add Product to Website';
      }
    });

    // ─── Toast ──────────────────────────────────────────────────────
    function showToast(message, type = 'success') {
      const wrap = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
        <span>${message}</span>
      `;
      wrap.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'toastOut 0.35s ease forwards';
        setTimeout(() => toast.remove(), 350);
      }, 4000);
    }
  </script>

</body>
</html>
